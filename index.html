<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta — overridden per-route by the useSEO hook -->
    <title>Priyansh Masiyava | Python Developer Portfolio</title>
    <meta name="description" content="Explore the portfolio of Priyansh Masiyava, a Computer Engineering student focused on Python development, practical software projects, and web development." />
    <meta name="author" content="Priyansh Masiyava" />
    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="Priyansh Masiyava, Python Developer, Computer Engineering, portfolio, software projects, Tkinter, Django, open source" />

    <!-- Canonical URL — fallback for homepage; per-route canonical injected by useSEO hook -->
    <link rel="canonical" href="https://prortfolio-priyansh.vercel.app/" />

    <!-- Theme color — matches navy-950 (#0B1020) -->
    <meta name="theme-color" content="#0B1020" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph — updated per-route by the useSEO hook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Priyansh Masiyava Portfolio" />
    <meta property="og:title" content="Priyansh Masiyava | Python Developer Portfolio" />
    <meta property="og:description" content="Explore the portfolio of Priyansh Masiyava, a Computer Engineering student focused on Python development, practical software projects, and web development." />
    <meta property="og:url" content="https://prortfolio-priyansh.vercel.app/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card — updated per-route by the useSEO hook -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Priyansh Masiyava | Python Developer Portfolio" />
    <meta name="twitter:description" content="Explore the portfolio of Priyansh Masiyava, a Computer Engineering student focused on Python development, practical software projects, and web development." />

    <!-- Favicon — using Vite default; replace with custom favicon assets when ready -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Theme initialisation — runs before first paint to avoid flash of wrong theme -->
    <script>
      (function() {
        var t = localStorage.getItem('pm-theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
